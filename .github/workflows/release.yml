name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: cargo

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rust-src

      - name: Install cargo-binstall
        run: |
          curl -LsSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install.sh | sh
          export PATH="$HOME/.cargo/bin:$PATH"

      - name: Install bpf-linker via cargo-binstall
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo binstall -y bpf-linker

      - name: Add bpfel-unknown-none target to nightly
        run: rustup target add bpfel-unknown-none --toolchain nightly

      - name: Build eBPF bytecode
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo run --package xtask -- build-ebpf

      - name: Build release binary
        run: cargo build --release

      - name: Package release archive & generate checksums
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="pulse-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -czvf "${ARCHIVE}" -C target/release pulse -C ../../ README.md LICENSE
          sha256sum "${ARCHIVE}" > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            pulse-*.tar.gz
            SHA256SUMS
