[package]
name = "pulse"
version = "0.7.0"
edition = "2024"
default-run = "pulse"

[workspace]
members = [
    ".",
    "pulse-common",
    "pulse-ebpf",
    "xtask",
]
default-members = [
    ".",
    "pulse-common",
    "xtask",
]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2.186"
nix = { version = "0.31.3", features = ["signal"] }
ratatui = "0.30.0"
tachyonfx = "0.25.0"
anyhow = "1.0"
aya = { version = "0.13", features = ["async_tokio"] }
tokio = { version = "1.0", features = ["full"] }
pulse-common = { path = "pulse-common", features = ["user"] }

[profile.dev.package.pulse-ebpf]
opt-level = 3

[profile.release.package.pulse-ebpf]
opt-level = 3
